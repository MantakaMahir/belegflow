services:
  app:
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.5
    environment:
      OPENAI_API_KEY: ""
      CLOUDFLARE_ACCESS_REQUIRED: "false"
      PUBLIC_DEMO_MODE: "true"
      PUBLIC_HOST: belegflow.gotiq.co
      PUBLIC_ACCESS_EMAIL: ""
    volumes:
      - !reset []
      - belegflow-public-demo-data:/app/data

  proxy:
    image: caddy:2.11.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  belegflow-public-demo-data:
