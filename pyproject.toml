[project]
name = "belegflow"
version = "0.1.0"
description = "Local-first AI document intake, review, and German tax classification."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<5",
  "openai>=2,<3",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "pypdfium2>=4.30,<6",
  "pillow>=11,<13",
  "google-auth[requests]>=2.37,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
